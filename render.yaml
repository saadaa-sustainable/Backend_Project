# Render service definition for the Backend_Project FastAPI service.
#
# What this deploys: the async FastAPI app in app/main.py, running under
# uvicorn on the port Render assigns via $PORT. NOT the Next.js admin
# UI in admin/ -- that's a separate service (deploy separately or run
# locally, whichever the workflow needs).
#
# What this does NOT do: run the APScheduler in-process (see
# SCHEDULER_ENABLED=false below). Render web instances are stateless
# and can be restarted / scaled anytime -- a scheduler running inside
# the web dyno would fire duplicate jobs on every restart. Daily
# syncs / retries / silver flattening should run on their own Render
# cron jobs (add later) or a separate worker service.
#
# Env vars marked `sync: false` are populated in the Render dashboard
# (not committed here). Any variable not listed here can still be set
# in the dashboard -- Render merges dashboard-set vars with this file.
#
# Auto-deploy: connect the master branch of
# github.com/saadaa-sustainable/Backend_Project.git in the Render UI.
# Every push to master will build + deploy automatically.

services:
  - type: web
    name: backend-project
    runtime: python
    # Free tier is fine for testing. Bump to `starter` ($7/mo) once
    # real traffic hits -- free-tier dynos sleep after 15min of
    # inactivity, which gives a cold-start hit on the first request
    # after idle.
    plan: free
    region: singapore
    branch: master
    autoDeploy: true

    buildCommand: pip install -r requirements.txt
    # uvicorn binds to Render's assigned $PORT, not the local :8001.
    # No --workers flag: uvloop + async endpoints saturate a single
    # worker just fine on the free tier's 512 MB. Add --workers 2
    # once the plan bumps up.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # /live is a cheap DB-only probe -- Render pings this every ~30s.
    # Deliberately NOT /health, because /health calls Meta's /me on
    # every hit and would burn ~2,880 API requests per day against the
    # shared app-level rate-limit budget, blocking real daily syncs.
    healthCheckPath: /live

    envVars:
      # --- Python runtime pin ---
      # Render defaults to whatever "latest stable" Python it currently
      # ships (2026-09: Python 3.14). Our pinned deps -- especially
      # pydantic-core 2.23.4 -- don't ship a pre-built wheel for 3.14
      # yet, so pip falls through to a source build with maturin +
      # Rust, which fails on Render's read-only build filesystem. Pin
      # to 3.12 (matches local .venv, has full wheel coverage).
      - key: PYTHON_VERSION
        value: "3.12.7"

      # --- REQUIRED (fill these in the Render dashboard) ---
      - key: META_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      # Shared secret EasyEcom echoes back as the `Access-Token` header
      # on every webhook. Must be the SAME string pasted into
      # EasyEcom's Webhook Settings. Unset => /webhooks/easyecom/*
      # returns 503 and refuses everything, which is deliberate: the
      # URL is public, so the secret is the only thing between EasyEcom
      # and anyone who learns the path.
      - key: EASYECOM_WEBHOOK_TOKEN
        sync: false

      # Numbered per-account creds. If only one account is deployed,
      # remove the 2 / 3 pairs -- otherwise leave them blank in the
      # dashboard and the account-discovery loop just skips them.
      - key: META_ACCOUNT_1_ID
        sync: false
      - key: META_ACCOUNT_1_NAME
        sync: false
      - key: META_ACCOUNT_2_ID
        sync: false
      - key: META_ACCOUNT_2_NAME
        sync: false
      - key: META_ACCOUNT_3_ID
        sync: false
      - key: META_ACCOUNT_3_NAME
        sync: false

      # Silver-layer RPCs (flatten_silver_metrics.py) and content
      # register mirror (fetch_content_asset_register.py). Optional --
      # only needed if you plan to run those scripts against this
      # deploy's env.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CONTENT_WORKFLOW_URL
        sync: false
      - key: CONTENT_SERVICE_KEY
        sync: false

      # --- OPTIONAL, values baked into the deploy ---
      - key: APP_ENV
        value: production
      - key: META_API_VERSION
        value: v21.0
      # Turn OFF the in-process APScheduler on Render web dynos --
      # web instances can be restarted / scaled; running a scheduler
      # inside them causes duplicate jobs on every cold start. Move
      # scheduled work to a separate Render cron / worker service.
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DATABASE_POOL_SIZE
        value: "10"
      - key: DATABASE_MAX_OVERFLOW
        value: "20"

      # CORS origin -- filled AFTER the admin service is deployed. Set
      # this in the Render dashboard to the frontend URL (e.g.
      # https://backend-project-admin-xxxx.onrender.com) so the browser
      # can hit /admin/analytics/* from a different origin.
      - key: ADMIN_APP_ORIGIN
        sync: false
      # Must match the browser-facing admin URL on BOTH services.
      - key: ASSISTANT_API_PUBLIC_ORIGIN
        value: https://backend-project-admin.onrender.com

  # ------------------------------------------------------------------
  # Admin panel (Next.js 15). Same repo, deployed from the `admin/`
  # subdirectory. Talks to the FastAPI backend via NEXT_PUBLIC_API_BASE_URL.
  #
  # First time setup:
  #   1. Let this service deploy (it will get a URL like
  #      backend-project-admin-xxxx.onrender.com)
  #   2. Copy that URL into the FastAPI service's ADMIN_APP_ORIGIN
  #      env var so CORS accepts it
  #   3. Copy the FastAPI service's URL into
  #      NEXT_PUBLIC_API_BASE_URL below (or set it in the dashboard)
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Hourly Tracker -- the fetch that feeds it.
  #
  # A Render cron rather than a GitHub Action, because the credentials
  # are already here: this service reads the same META_ACCESS_TOKEN,
  # SHOP_DOMAIN and ADMIN_ACCESS_TOKEN the API does, from the same
  # dashboard, instead of a second copy living in repo secrets that
  # drifts from the first the next time a token is rotated.
  #
  # Every hour at :05. Not :00 -- Shopify and Meta both need a few
  # minutes to settle the hour that just closed, and a fetch on the
  # stroke of the hour reads the previous hour short, which looks like
  # a collapse in traffic rather than a job that ran too early.
  #
  # It refetches TODAY in full each run, not just the newest hour.
  # Both sources restate recent hours as conversions and sessions land,
  # so the hour before last is still moving; re-reading the whole day
  # costs one extra API call and keeps every hour correct rather than
  # frozen at whatever it was when it was first written.
  # ------------------------------------------------------------------
  - type: cron
    name: hourly-tracker-fetch
    runtime: python
    plan: starter
    region: singapore
    branch: master
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/fetch_hourly_tracker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # --- database -------------------------------------------------
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      # --- Meta: spend and impressions ------------------------------
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_API_VERSION
        value: v21.0
      - key: META_ACCOUNT_1_ID
        sync: false
      - key: META_ACCOUNT_1_NAME
        sync: false
      - key: META_ACCOUNT_2_ID
        sync: false
      - key: META_ACCOUNT_2_NAME
        sync: false
      - key: META_ACCOUNT_3_ID
        sync: false
      - key: META_ACCOUNT_3_NAME
        sync: false
      # --- Shopify: sessions, sales and the orders behind the channel
      # split. Same pair scripts/shopify_client.py reads locally.
      - key: SHOP_DOMAIN
        sync: false
      - key: ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOP_NAME
        sync: false
      - key: SHOPIFY_API_VERSION
        sync: false
      # --- GA4: ARPU. Optional -- the fetch reports the hour without
      # it rather than failing, because ARPU is one column of fourteen.
      #
      # A PATH, not the JSON itself: scripts/fetch_ga4_daily.py's
      # credential chain does `Path(sa).exists()` on this value, so an
      # inline key would be read as a filename, fail that test, and
      # fall through to ADC -- which carries no Analytics scope and
      # dies with ACCESS_TOKEN_SCOPE_INSUFFICIENT. Upload the service
      # account JSON as a Render Secret File and point this at where
      # Render mounts it.
      - key: GA4_PROPERTY_ID
        value: "383126449"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/ga4-service-account.json
      - key: APP_ENV
        value: production

  # ------------------------------------------------------------------
  # Hourly Tracker -- its own static site, on purpose.
  #
  # It ships during a live campaign, when the admin app's build can be
  # red for reasons that have nothing to do with it. One HTML file, no
  # build step, no node_modules: there is almost nothing here that can
  # fail to deploy.
  #
  # It reads the SAME /admin/analytics/hourly-tracker endpoint the admin
  # app does, so the two cannot disagree about a number.
  #
  # The API base is not baked in -- a static site has no server to
  # inject one. It comes from ?api=https://... on first load and is
  # remembered, which also lets the same file run against localhost.
  #
  # Add this site's origin to EXTRA_APP_ORIGINS on backend-project or
  # every request it makes is refused by CORS -- and a refused request
  # renders as an empty page rather than an error.
  # ------------------------------------------------------------------
  - type: web
    name: hourly-tracker
    runtime: static
    plan: free
    branch: master
    autoDeploy: true
    staticPublishPath: ./tracker
    headers:
      - path: /*
        name: Cache-Control
        # The page is a shell; its data is fetched live. Caching the
        # shell for an hour would hand someone a stale build during the
        # one day it matters.
        value: no-cache

  - type: web
    name: backend-project-admin
    runtime: node
    plan: free
    region: singapore
    branch: master
    autoDeploy: true

    # rootDir = folder within the repo where package.json lives.
    rootDir: admin
    # Next.js production build. Render caches node_modules between
    # deploys so subsequent builds are much faster than the first.
    buildCommand: npm ci && npm run build
    # `next start` binds to $PORT automatically -- no --port flag needed.
    startCommand: npm start

    envVars:
      # Filled AFTER the FastAPI service is deployed. Point this at
      # the backend URL (no trailing slash), e.g.
      # https://backend-project-mlk9.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: ASSISTANT_API_PUBLIC_ORIGIN
        value: https://backend-project-admin.onrender.com
      # Node 20 has full Next.js 15 support and pre-built binaries for
      # every native module in package.json. Node 22 also works but
      # 20 is Render's default LTS.
      - key: NODE_VERSION
        value: "20"
