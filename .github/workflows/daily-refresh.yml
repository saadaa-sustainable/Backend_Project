# Backend_Project daily refresh via GitHub Actions.
#
# Runs scripts/refresh_all_daily.py once a day. Each step writes its
# per-script status to public.cron_run_log in Supabase; a helper in
# scripts/check_cron_status.py can be run from any dev machine (or by
# Claude in a future session) to inspect recent runs.
#
# ---------------------------------------------------------------------
# Schedule (both dashboards use Meta -- gap between projects):
#   CTD refresh   19:30 UTC = 01:00 IST  (~90-150 min)
#   BP  refresh   01:30 UTC = 07:00 IST  (~80-140 min)   <-- this file
#
# Manual trigger: Actions tab -> "Backend_Project daily refresh" -> Run.
# The schedule below IS live (it was enabled once cron_run_log showed
# real rows) -- both notes above previously said 05:00 IST and "commented
# out", neither of which had been true since the 7am schedule landed.
#
# There is nothing Shopify-specific to add here. This file's only job is
# to invoke scripts/refresh_all_daily.py; the step list lives in that
# script's PHASE_INGEST/PHASE_SILVER, so every fix to the Shopify chain
# -- the incremental scoped ingest (shopify_daily), the selective silver
# flatten and the attribution statement_timeout (silver_shopify) -- is
# picked up here automatically, with no edit to this workflow.
#
# What this run WILL refresh from Shopify: products, inventory, orders
# (scripts/refresh_all_daily.py's DEFAULT_SHOPIFY_OBJECT_TYPES), and the
# silver tables built from them -- shopify_orders and shopify_inventory.
# What it will NOT: shopify_sessions / _sales / _discounts /
# _fulfillments / _customer_analytics. Their BRONZE is never fetched on
# this path, so the selective flatten correctly skips them. Widening it
# means passing --shopify-object-types all, which re-walks ~2.9M rows of
# ShopifyQL tables that have no incremental mode -- a deliberate
# trade-off, not an oversight.
# ---------------------------------------------------------------------

name: Backend_Project daily refresh

on:
  workflow_dispatch:
    inputs:
      skip_meta:
        description: "Skip Phase 1 (Meta ingest)?"
        required: false
        default: "false"
      only_silver:
        description: "Only run Phase 2 (silver rebuild)?"
        required: false
        default: "false"

  schedule:
    # 01:30 UTC = 07:00 IST, daily. Cron in GitHub Actions is always UTC,
    # so this is the 7am-IST run -- do not "correct" it to 30 7 * * *,
    # which would fire at 13:00 IST.
    - cron: "30 1 * * *"
    # BACKUP, 02:30 UTC = 08:00 IST. GitHub does not guarantee scheduled
    # runs: it drops them under load and delays them routinely. Measured
    # on the sibling project 2026-09-05, its 19:30 UTC schedule started
    # at 21:40 one night (2h10m late) and did not fire at all the next.
    # A dropped nightly refresh means a whole day of stale dashboards
    # with nothing to indicate it.
    #
    # Two crons an hour apart make that far less likely, and the guard
    # step below makes the second one free: it exits immediately when
    # the first already ran. Both are cheap when nothing is wrong.
    - cron: "30 2 * * *"

concurrency:
  # Never let two refreshes race against the same Supabase tables.
  group: bp-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Raised from 90 (2026-09-04). The Shopify ingest step alone may now
    # use up to 5400s (90 min) -- it was capped at 1800s before, which is
    # precisely why it timed out on every run and left Shopify data 8
    # days stale. A 90-minute JOB cap would kill the run before that one
    # step could even reach its own limit, so the ceiling has to sit
    # above the sum of the steps that actually run long.
    #
    # This is a safety net, not an expectation: a healthy run is still
    # ~45-60 min. GitHub's own hard ceiling is 6h; 240 leaves room for a
    # Meta-throttle day without letting a wedged run burn the whole
    # allowance.
    timeout-minutes: 240

    # actions:read is what the duplicate guard below needs to see this
    # workflow's own run history. Nothing here writes to the repo.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Skip if the primary schedule already ran
        # Only the 02:30 UTC backup can be a duplicate; a manual dispatch
        # is always deliberate and a 01:30 run is the primary.
        #
        # Looks for any OTHER run of this workflow created in the last 5
        # hours. If one exists the primary fired and this backup has
        # nothing to do, so every real step below is skipped and the job
        # ends green in seconds.
        #
        # 5 hours, not 1: a healthy run takes 45-60 min and a
        # Meta-throttle day stretches past 3h. A window shorter than the
        # run itself would let the backup start a second refresh on top
        # of a slow first one -- exactly what the concurrency group
        # exists to prevent.
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '5 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          RECENT="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow daily-refresh.yml \
              --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }})
                        | select(.createdAt > \"$CUTOFF\")] | length")"
          echo "runs of this workflow since $CUTOFF (excluding this one): $RECENT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$RECENT" -gt 0 ]; then
            echo "A refresh already ran in that window -- skipping this one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          # requirements.txt drives the whole scripts/ suite. Keep it
          # up to date in the repo so this workflow doesn't drift.
          pip install -r requirements.txt

      - name: Restore BigQuery service account
        if: steps.guard.outputs.skip != 'true'
        # GH secret GOOGLE_CREDS_JSON holds the raw JSON (paste the whole
        # file content into the secret). We write it to disk, then point
        # GOOGLE_APPLICATION_CREDENTIALS at the path so the BQ client
        # picks it up transparently.
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDS_JSON" ]; then
            echo "$GOOGLE_CREDS_JSON" > "$RUNNER_TEMP/gcp.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
          fi

      - name: Run daily refresh
        if: steps.guard.outputs.skip != 'true'
        env:
          # --- Supabase Postgres (required) ---
          DATABASE_URL_SYNC:                ${{ secrets.DATABASE_URL_SYNC }}
          # The per-ad + per-day metric source. Absent, scripts/
          # sync_ad_metrics_external.py exits 0 without writing and the
          # dashboard keeps this project's own figures.
          AD_METRICS_SOURCE_URL:            ${{ secrets.AD_METRICS_SOURCE_URL }}
          DATABASE_URL:                     ${{ secrets.DATABASE_URL }}
          DATABASE_SERVICE_KEY:             ${{ secrets.DATABASE_SERVICE_KEY }}

          # --- Meta ads (required for Phase 1 Meta ingest) ---
          META_ACCESS_TOKEN:                ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:                 ${{ secrets.META_API_VERSION }}
          META_APP_ID:                      ${{ secrets.META_APP_ID }}
          META_APP_SECRET:                  ${{ secrets.META_APP_SECRET }}
          META_GRAPH_API_BASE_URL:          ${{ secrets.META_GRAPH_API_BASE_URL }}
          META_ACCOUNT_1_ID:                ${{ secrets.META_ACCOUNT_1_ID }}
          META_ACCOUNT_1_NAME:              ${{ secrets.META_ACCOUNT_1_NAME }}
          META_ACCOUNT_2_ID:                ${{ secrets.META_ACCOUNT_2_ID }}
          META_ACCOUNT_2_NAME:              ${{ secrets.META_ACCOUNT_2_NAME }}
          META_ACCOUNT_3_ID:                ${{ secrets.META_ACCOUNT_3_ID }}
          META_ACCOUNT_3_NAME:              ${{ secrets.META_ACCOUNT_3_NAME }}
          META_HTTP_TIMEOUT_SECONDS:        ${{ secrets.META_HTTP_TIMEOUT_SECONDS }}
          META_HTTP_CONNECT_TIMEOUT_SECONDS: ${{ secrets.META_HTTP_CONNECT_TIMEOUT_SECONDS }}
          META_MAX_CONCURRENT_REQUESTS:     ${{ secrets.META_MAX_CONCURRENT_REQUESTS }}
          META_MAX_RETRIES:                 ${{ secrets.META_MAX_RETRIES }}
          META_PAGE_SIZE:                   ${{ secrets.META_PAGE_SIZE }}
          META_RATE_LIMIT_SLEEP_BUFFER_SECONDS: ${{ secrets.META_RATE_LIMIT_SLEEP_BUFFER_SECONDS }}
          META_RETRY_BACKOFF_BASE_SECONDS:  ${{ secrets.META_RETRY_BACKOFF_BASE_SECONDS }}
          META_RETRY_BACKOFF_MAX_SECONDS:   ${{ secrets.META_RETRY_BACKOFF_MAX_SECONDS }}

          # --- Instagram (Phase 1 IG ingest) ---
          IG_USER_ID_1:                     ${{ secrets.IG_USER_ID_1 }}
          IG_USER_ID_2:                     ${{ secrets.IG_USER_ID_2 }}
          IG_USER_ID_3:                     ${{ secrets.IG_USER_ID_3 }}
          IG_USERNAME:                      ${{ secrets.IG_USERNAME }}
          IG_USERNAME_1:                    ${{ secrets.IG_USERNAME_1 }}
          IG_USERNAME_2:                    ${{ secrets.IG_USERNAME_2 }}

          # --- Shopify (Phase 1 Shopify ingest; scripts also honor
          # SHOP_DOMAIN_2/ADMIN_ACCESS_TOKEN_2 for multi-store) ---
          SHOP_DOMAIN:                      ${{ secrets.SHOP_DOMAIN }}
          ADMIN_ACCESS_TOKEN:               ${{ secrets.ADMIN_ACCESS_TOKEN }}
          SHOP_NAME:                        ${{ secrets.SHOP_NAME }}
          SHOPIFY_API_VERSION:              ${{ secrets.SHOPIFY_API_VERSION }}

          # --- BigQuery (optional; empty skips fetch_bq_inventory) ---
          BQ_INVENTORY_TABLE:               ${{ secrets.BQ_INVENTORY_TABLE }}

        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.skip_meta }}" = "true" ]; then
            FLAGS="$FLAGS --skip-meta"
          fi
          if [ "${{ github.event.inputs.only_silver }}" = "true" ]; then
            FLAGS="$FLAGS --only-silver"
          fi
          python scripts/refresh_all_daily.py $FLAGS

      - name: Report Shopify freshness
        # The single quickest way to tell a 7am run that actually landed
        # data from one that ran green and fetched nothing. Same check
        # the manual Shopify workflow prints; kept identical on purpose.
        #
        # One indexed MAX per type, not a GROUP BY over the whole table:
        # PostgreSQL has no index skip-scan, so the grouped form
        # seq-scans all ~5.2M bronze rows (measured live 2026-09-04:
        # 43.2s, versus 0.1ms off ix_raw_dump_shopify_object_type_
        # extracted's tip).
        #
        # always(), so a failed refresh still reports how stale the data
        # it left behind is -- but not when the duplicate guard skipped
        # the job, where there is nothing to report on.
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
        run: |
          python - <<'PY'
          import os, sys
          dsn = (os.environ.get("DATABASE_URL_SYNC") or "").replace(
              "postgresql+psycopg2://", "postgresql://")
          if not dsn:
              print("DATABASE_URL_SYNC not set -- skipping freshness check")
              sys.exit(0)
          try:
              import psycopg2
              with psycopg2.connect(dsn) as conn, conn.cursor() as cur:
                  print("bronze (raw_dump_shopify):")
                  for object_type in ("products", "inventory", "orders"):
                      cur.execute(
                          "SELECT MAX(extracted_at) FROM raw_dump_shopify"
                          " WHERE object_type = %s", (object_type,))
                      print(f"  {object_type:10s} {cur.fetchone()[0] or '(no rows)'}")
                  print("silver (rebuilt only when its bronze moved):")
                  for table in ("shopify_orders", "shopify_inventory"):
                      cur.execute(f"SELECT MAX(extracted_at) FROM {table}")
                      print(f"  {table:20s} {cur.fetchone()[0] or '(empty)'}")
          except Exception as exc:
              # Never fail the job on the report itself -- the refresh
              # result is what matters.
              print(f"Freshness check skipped: {type(exc).__name__}: {exc}")
          PY

      - name: Upload full log
        # Keep the raw GH Actions log accessible for 14 days even after
        # the workflow_run rotates -- helps when a step's tail in
        # cron_run_log isn't enough to diagnose.
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_id }}
          path: |
            logs/**/*.log
            *.log
          if-no-files-found: ignore
          retention-days: 14
