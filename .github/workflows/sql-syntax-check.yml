# Parse every SQL constant with a real PostgreSQL parser, on every push
# and PR. Cheap (no database, no secrets) and catches the one class of
# bug the other checks structurally cannot: a Python file that is
# perfectly valid while the SQL string inside it is not.
#
# Added after scripts/refresh_cpis_sku_context.py shipped a dangling
# comma before its INSERT and failed on every daily run for two days.
# ruff was green throughout -- a broken SQL string is a valid str.

name: SQL syntax check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metrics_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Parse SQL constants
        run: python scripts/check_sql_syntax.py
      - name: Verify Shopify Silver refresh
        run: >-
          python -m pytest tests/test_attribution_refresh.py
          tests/test_daily_silver_pipeline.py tests/test_daily_workflow_guard.py
          tests/test_shopify_utm.py tests/test_config.py -q
      - name: Verify daily ad metrics with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metrics_tests
        run: python -m pytest tests/test_daily_ad_metrics_refresh.py -q
      - name: Verify dashboard timeout protections
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metrics_tests
        run: >-
          python -m pytest tests/test_flatten_poll.py
          tests/test_dashboard_timeout_indexes.py tests/test_last_click_loading.py -q
