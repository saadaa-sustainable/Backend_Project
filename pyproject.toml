[tool.poetry]
name = "meta-marketing-ingestion"
version = "0.1.0"
description = "Production-grade FastAPI service that ingests all available data from the Meta Marketing API into a PostgreSQL Bronze layer."
authors = ["Data Engineering <data-eng@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
httpx = "^0.27.2"
sqlalchemy = "^2.0.35"
greenlet = "^3.5.4"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.12"
alembic = "^1.13.3"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
apscheduler = "^3.10.4"
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"
orjson = "^3.10.7"
structlog = "^24.4.0"
python-pptx = "^1.0.2"
python-multipart = "^0.0.12"
anthropic = "^0.120.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
respx = "^0.21.1"
ruff = "^0.6.9"
mypy = "^1.11.2"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
